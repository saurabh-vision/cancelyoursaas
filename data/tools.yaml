    saas_price_per_user_month: 8.75
    alternative_name: "Mattermost"
    alternative_url: "https://mattermost.com"
    license: "AGPL-3.0"
    self_host: true
    cloud_option_url: "https://mattermost.com/pricing/"
    cloud_price: "$10/user/month"
    difficulty: "medium"
    what_youll_miss: "Polished Slack Huddles, friction-free cross-org Slack Connect channels, and thousands of pre-configured enterprise bot plugins."
    category: "Communication"

