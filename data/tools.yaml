# cancel-your-saas: Open-source alternatives to expensive SaaS tools
# Schema for each entry:
# - saas_name: Name of the proprietary SaaS tool (string)
# - saas_price_per_user_month: Baseline list price per user/month in USD (number)
# - alternative_name: Name of the open-source alternative (string)
# - alternative_url: Homepage or repository URL of the alternative (string)
# - license: Open-source or source-available license, e.g., AGPL-3.0, Apache-2.0, MIT (string)
# - self_host: Whether it can be fully self-hosted for free (boolean)
# - cloud_option_url: Optional URL for managed cloud hosting (string, optional)
# - cloud_price: Optional pricing for managed cloud hosting (string, optional)
# - difficulty: Self-hosting and maintenance difficulty: easy | medium | hard (string)
# - what_youll_miss: Honest, pragmatic trade-offs and missing convenience features (string)
# - category: Functional category (string)

tools:
  # ==========================================
  # 1. Communication
  # ==========================================
