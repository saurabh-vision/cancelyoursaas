<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Emerald Glow Accent Gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="boxGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.15)" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0.05)" />
    </linearGradient>

    <!-- Filter for soft glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="150" r="180" fill="#10b981" opacity="0.12" filter="url(#glow)" />
  <circle cx="1000" cy="480" r="220" fill="#38bdf8" opacity="0.1" filter="url(#glow)" />

  <!-- Card Border Container -->
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="none" stroke="#334155" stroke-width="2" />
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="none" stroke="url(#textGradient)" stroke-width="2" opacity="0.4" />

  <!-- Top Badge -->
  <g transform="translate(80, 85)">
    <rect width="230" height="38" rx="19" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <text x="115" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#60a5fa" text-anchor="middle" letter-spacing="0.08em">OPEN-SOURCE DIRECTORY</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" fill="url(#textGradient)" letter-spacing="-0.03em">Cancel Your SaaS 💸</text>

  <!-- Tagline -->
  <text x="80" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="600" fill="#f8fafc">Your CFO will thank you.</text>

  <text x="80" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">Curated alternatives to expensive proprietary software — with brutally honest trade-offs.</text>

  <!-- Feature Metric Box (Right side) -->
  <g transform="translate(740, 95)">
    <rect width="380" height="440" rx="20" fill="url(#boxGradient)" stroke="#10b981" stroke-width="1.5" />
    
    <text x="190" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="0.05em">10-PERSON TEAM SAVINGS</text>
    
    <text x="190" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#34d399" text-anchor="middle">$116,798</text>
    <text x="190" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#64748b" text-anchor="middle">Saved in license cash per year</text>

    <!-- Mini replacements list -->
    <line x1="40" y1="200" x2="340" y2="200" stroke="#334155" stroke-width="1" />
    
    <g transform="translate(50, 240)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#ef4444">🪦 Slack</text>
      <text x="120" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#94a3b8">→</text>
      <text x="150" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#34d399">✅ Mattermost</text>
    </g>

    <g transform="translate(50, 285)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#ef4444">🪦 Jira</text>
      <text x="120" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#94a3b8">→</text>
      <text x="150" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#34d399">✅ Plane</text>
    </g>

    <g transform="translate(50, 330)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#ef4444">🪦 Calendly</text>
      <text x="120" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#94a3b8">→</text>
      <text x="150" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#34d399">✅ Cal.com</text>
    </g>

    <g transform="translate(50, 375)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#ef4444">🪦 Notion</text>
      <text x="120" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#94a3b8">→</text>
      <text x="150" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#34d399">✅ AppFlowy</text>
    </g>
  </g>

  <!-- Bottom Pills (Left side) -->
  <g transform="translate(80, 475)">
    <rect width="180" height="42" rx="10" fill="#1e293b" stroke="#334155" />
    <text x="90" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">46+ Tools Tracked</text>

    <rect x="195" width="160" height="42" rx="10" fill="#1e293b" stroke="#334155" />
    <text x="275" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">10 Categories</text>

    <rect x="370" width="180" height="42" rx="10" fill="#1e293b" stroke="#334155" />
    <text x="460" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">0% Affiliate Links</text>
  </g>
</svg>
